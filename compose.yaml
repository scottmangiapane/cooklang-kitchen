services:
  cooklang-kitchen:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      RECIPES_DIR: /recipes
      IMAGE_CACHE_DIR: /image-cache
      RECIPE_CACHE_DIR: /recipe-cache
    volumes:
      - ./recipes:/recipes:ro
      - image-cache:/image-cache
      - recipe-cache:/recipe-cache

volumes:
  image-cache:
  recipe-cache:
