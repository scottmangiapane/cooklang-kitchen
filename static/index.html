<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f8f7f2">
  <meta name="description" content="A simple, self-hosted Cooklang recipe library.">
  <link rel="icon" href="/static/logo.svg" type="image/svg+xml">
  <title>Cooklang Kitchen</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/icons.js" defer></script>
  <script src="/static/app.js" defer></script>

  <header class="topbar">
    <a class="brand" href="#/" aria-label="Kitchen home"><img class="brand-mark" src="/static/logo.svg" alt=""><span><span class="brand-accent">Cooklang</span> Kitchen</span></a>

</html>
